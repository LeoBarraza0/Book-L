name: book_l
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  flutter_svg: ^2.0.10+1
  flutter_quill: ^11.5.0
  shared_preferences: ^2.5.5
  uuid: ^4.5.1
  video_player: ^2.9.1
  flutter_pdfview: ^1.3.2
  file_picker: ^8.1.7
  url_launcher: ^6.3.2
  mailer: ^7.1.0
  http: ^1.6.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/Chatbot_Icon.png"
  min_sdk_android: 21 # android min sdk min:16, default:21


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
